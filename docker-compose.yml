services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sirh-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - sirh_storage:/var/www/storage
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: sirh_dakar
      DB_USERNAME: sirh_user
      DB_PASSWORD: sirh_password
      CORS_ORIGINS: http://localhost
      SMS_DRIVER: ${SMS_DRIVER:-log}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
      AFRICASTALKING_FROM: ${AFRICASTALKING_FROM:-SIRH}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - sirh_network

  nginx:
    image: nginx:stable-alpine
    container_name: sirh-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - sirh_network

  database:
    image: mysql:8.0
    container_name: sirh-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sirh_dakar
      MYSQL_USER: sirh_user
      MYSQL_PASSWORD: sirh_password
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - sirh_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sirh_network

volumes:
  sirh_mysql_data:
  sirh_storage:

networks:
  sirh_network:
    driver: bridge
